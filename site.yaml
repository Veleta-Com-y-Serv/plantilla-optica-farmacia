  servicios:
    activa: true
    antetitulo: Lo que hacemos
    titulo: Dos mostradores, el mismo cuidado
    texto: "A un lado, la farmacia de siempre del barrio. Al otro, una óptica con gabinete de optometría y audiología. Entras por la misma puerta."
    items:
      - { titulo: Graduación de la vista, texto: "Revisión completa con optometrista colegiado, para adultos y niños.", icono: ojo, categoria: Óptica }
      - { titulo: Gafas graduadas y de sol, texto: "Monturas de acetato y titanio, lentes progresivas y filtros para pantallas.", icono: gafas, categoria: Óptica }
      - { titulo: Lentes de contacto, texto: "Adaptación, prueba y seguimiento de lentillas diarias, mensuales y de noche.", icono: lentilla, categoria: Óptica }
      - { titulo: Audiología y audífonos, texto: "Prueba de audición, adaptación de audífonos y limpieza de los que ya llevas.", icono: oido, categoria: Óptica }
      - { titulo: Receta electrónica y encargos, texto: "Dispensación con tu tarjeta sanitaria y encargos que llegan en el día.", icono: receta, categoria: Farmacia }
      - { titulo: Consejo y seguimiento, texto: "Toma de tensión, control de glucosa y revisión de tu medicación.", icono: corazon, categoria: Farmacia }
      - { titulo: Dermofarmacia y nutrición, texto: "Cuidado de la piel, protección solar e infantil, con muestras para probar.", icono: hoja, categoria: Farmacia }
      - { titulo: Ortopedia, texto: "Medias de compresión, plantillas, fajas y ayudas para casa con medición.", icono: muleta, categoria: Farmacia }
    galeria:
      - /fotos/franja-1.jpg
      - /fotos/franja-2.jpg
      - /fotos/franja-3.jpg
      - /fotos/franja-4.jpg

