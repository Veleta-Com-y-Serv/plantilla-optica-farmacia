  consejos:
    activa: true
    antetitulo: Consejos de salud
    titulo: Lo que te contaríamos en el mostrador
    texto: "Consejos cortos de nuestras farmacéuticas y de nuestro optometrista."
    noticias:
      - { fecha: Noviembre, titulo: "Gafas de sol también en invierno, y más en la nieve", texto: "La nieve refleja casi toda la luz del sol. Si subes al Pirineo, lleva gafas con filtro de categoría alta y protección lateral.", imagen: /fotos/consejo-1.jpg }
      - { fecha: Octubre, titulo: "Botiquín de viaje: lo imprescindible", texto: "Tu medicación con el prospecto, analgésico, suero oral, tiritas y protector solar. Y la receta, por si acaso.", imagen: /fotos/consejo-2.jpg }
      - { fecha: Septiembre, titulo: "La regla 20-20-20 frente a las pantallas", texto: "Cada veinte minutos, mira a unos seis metros durante veinte segundos. Tus ojos lo notan al final del día.", imagen: /fotos/consejo-3.jpg }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que más nos preguntáis
    texto: "Si no encuentras tu duda, escríbenos por WhatsApp y te respondemos en el día."
    preguntas:
      - { pregunta: ¿La revisión de la vista tiene coste?, respuesta: "No. La revisión con el optometrista es gratuita y no te obliga a comprar nada. Pide cita para no esperar." }
      - { pregunta: ¿Puedo recoger la medicación de otra persona?, respuesta: "Sí. Trae su tarjeta sanitaria y te dispensamos su receta electrónica como si fuera ella." }
      - { pregunta: ¿Cómo sé qué farmacia está de guardia?, respuesta: "Nuestros turnos están en esta web. Los demás días, llámanos y te decimos cuál es la farmacia de guardia más cercana." }
      - { pregunta: ¿Me guardáis un medicamento que no tenéis?, respuesta: "Sí. Encárgalo por WhatsApp o en el mostrador; casi siempre llega en el día y te avisamos cuando está." }
      - { pregunta: ¿Hacéis gafas para niños?, respuesta: "Sí. Revisamos la vista de los más pequeños y tenemos monturas flexibles pensadas para ellos." }

