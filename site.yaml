    activa: true
    antetitulo: Farmacia de guardia
    titulo: De guardia cuando más hace falta
    texto: "Formamos parte del turno de guardias de Pamplona. Estos son nuestros próximos turnos; el resto de noches, te decimos en el teléfono cuál es la farmacia de guardia más cercana."
    imagen: /fotos/guardia.jpg
    destacado: { titulo: Teléfono de guardia, telefono: "948 21 70 36", texto: "Llama al timbre de la ventanilla: te atendemos sin que tengas que entrar." }
    turnos:
      - { fecha: Sábado 7 de noviembre, horas: "9:30 a 9:30 del domingo", texto: Guardia de 24 horas }
      - { fecha: Jueves 19 de noviembre, horas: "21:30 a 9:00", texto: Guardia de noche }
      - { fecha: Sábado 28 de noviembre, horas: "14:00 a 22:00", texto: Guardia de tarde }
      - { fecha: Domingo 6 de diciembre, horas: "9:30 a 9:30 del lunes", texto: Guardia de 24 horas }

  ofertas:
    activa: true
    antetitulo: Promociones
    titulo: Este mes, en la farmacia
    texto: "Promociones del mes en óptica y parafarmacia. Pregúntanos en el mostrador o por WhatsApp."
    imagen: /fotos/ofertas.jpg
    ofertas:
      - { titulo: Segundas gafas de sol graduadas, texto: "Al hacerte unas gafas progresivas, las segundas de sol graduadas a mitad de precio.", precio: "-50 %", validez: Hasta el 30 de noviembre }
      - { titulo: Lentillas para tres meses, texto: "Lentillas mensuales y líquido de mantenimiento en un solo pack.", precio: "39 €", validez: Mientras haya existencias }
      - { titulo: Revisión de audición, texto: "Prueba auditiva completa y limpieza de audífonos de cualquier marca.", precio: Sin coste, validez: Con cita previa }
      - { titulo: Cuidado de invierno, texto: "Cremas de manos, bálsamos labiales y sueros de farmacia.", precio: "3x2", validez: Hasta el 15 de diciembre }
    nota: "Promociones no acumulables entre sí. Consulta las condiciones en la farmacia."
    cta: { texto: Preguntar por WhatsApp, url: "/#contacto" }

  cita:
    activa: true
    antetitulo: Revisión visual
    titulo: Tu graduación en veinte minutos
    texto: "Te revisa un óptico-optometrista colegiado en un gabinete propio. Sin coste y sin compromiso de compra."
    imagen: /fotos/cita.jpg
    cta: { texto: Pedir cita, url: "/#contacto" }
    items:
      - { titulo: Pide cita, texto: "Por WhatsApp, por teléfono o en el mostrador. Normalmente, para el mismo día." }
      - { titulo: Te graduamos, texto: "Agudeza visual, presión ocular y visión de cerca, con explicación de cada prueba." }
      - { titulo: Eliges con calma, texto: "Te enseñamos monturas y lentes para tu graduación, con el presupuesto por escrito." }

  marcas:
    activa: true
